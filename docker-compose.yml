services:
  test-db:
    image: mysql:8.0
    platform: linux/amd64
    restart: always
    ports:
      - '3308:3306'
    environment:
      MYSQL_DATABASE: test-db
      MYSQL_USER: test-db-username
      MYSQL_PASSWORD: test-db-password
      MYSQL_ROOT_PASSWORD: test-db-password
    volumes:
      - ./.docker/mysql/data:/var/lib/mysql